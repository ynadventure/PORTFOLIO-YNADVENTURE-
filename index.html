<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Viewport</title>

  <!-- Aesthetic Minimalist Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons for Social Media -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a; /* Solid dark slate background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1e293b;
    }

    /* Enhanced Scrollable Phone Frame */
    .app-viewport {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 840px;
      
      /* Vibrant animated gradient background */
      background: linear-gradient(-45deg, #c7d2fe, #e0e7ff, #a5b4fc, #818cf8);
      background-size: 300% 300%;
      animation: gradientShift 10s ease infinite;

      overflow-y: auto;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.6),
        0 0 35px rgba(99, 102, 241, 0.3);
      
      /* Stylish glassmorphic border outline */
      border: 3px solid rgba(255, 255, 255, 0.6);
      border-radius: 36px;
      padding: 18px;
      scrollbar-width: none;
      position: relative;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .app-viewport::-webkit-scrollbar {
      display: none;
      width: 0;
    }

    /* Floating Decorative Micro-Glow Accents Inside Viewport */
    .viewport-accent-1 {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(46, 28, 199, 0.25);
      filter: blur(30px);
      pointer-events: none;
    }

    .viewport-accent-2 {
      position: absolute;
      bottom: 20px;
      left: -20px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(129, 140, 248, 0.35);
      filter: blur(25px);
      pointer-events: none;
    }

    /* Extended Front Box (Card) - Light Matching Blue Background */
    .section-card {
      background: rgba(240, 244, 255, 0.94);
      backdrop-filter: blur(12px);
      padding: 24px 16px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 
        0 10px 25px -5px rgba(0, 0, 0, 0.05),
        0 0 1px 1px rgba(255, 255, 255, 0.9) inset;
      width: 100%;
      min-height: 780px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* Circular Profile Image with Outer Accent Border Detail */
    .avatar-container {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      margin: 20px auto 16px auto;
      border: 4px solid #ffffff;
      outline: 2px dashed #818cf8;
      outline-offset: 4px;
      box-shadow: 
        0 8px 16px -2px rgba(46, 28, 199, 0.12),
        0 0 15px rgba(129, 140, 248, 0.25);
      align-self: center;
      transition: transform 0.3s ease, outline-color 0.3s ease;
    }

    .avatar-container:hover {
      transform: scale(1.03);
      outline-color: #2e1cc7;
    }

    .avatar-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Banner container with reduced top and bottom height */
    .title-shape-container {
      background-color: #2e1cc7;
      width: 85%;
      margin-left: -16px;
      margin-top: 20px;
      padding: 6px 0 6px 32px;
      position: relative;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
      box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.15);
    }

    /* Minimalist Aesthetic Heading */
    .hero-title {
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      
      /* Black outline effect */
      text-shadow: 
        -1.5px -1.5px 0 #000,
        1.5px -1.5px 0 #000,
        -1.5px 1.5px 0 #000,
        1.5px 1.5px 0 #000;
    }

    /* Section Subtitle with distinct Slate Grey color */
    .section-subtitle {
      font-size: 14px;
      font-weight: 800;
      color: #475569;
      margin-top: 24px;
      padding-left: 0px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Left-aligned Vertical Social List Container */
    .social-list-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 12px;
      padding-left: 0px;
    }

    /* Minimalist Grid Column for Social Items */
    .social-item {
      display: grid;
      grid-template-columns: 24px 85px 12px 1fr;
      align-items: center;
      color: #1e293b;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.03em;
      cursor: default;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .social-item:hover {
      transform: translateX(4px);
    }

    .social-item i {
      font-size: 15px;
      text-align: left;
    }

    /* Original Brand Colors */
    .fa-facebook-f {
      color: #1877f2;
    }

    .fa-instagram {
      background: -webkit-linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .fa-tiktok {
      color: #000000;
    }

    .social-item span {
      text-align: left;
    }

    .colon {
      text-align: left;
      font-weight: 600;
      color: #475569;
    }

    /* Aligned Minimalist Quote Box Styling */
    .quote-box {
      margin-top: 24px;
      padding: 14px 16px;
      background-color: #e0e7ff;
      border-left: 3px solid #2e1cc7;
      border-radius: 0 10px 10px 0;
      text-align: left;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .quote-text {
      font-size: 12px;
      font-style: italic;
      font-weight: 400;
      line-height: 1.6;
      color: #334155;
      letter-spacing: 0.01em;
    }

    @media (max-width: 480px) {
      .app-viewport {
        max-height: 100vh;
        border-radius: 0;
        border: none;
      }
      
      .section-card {
        min-height: calc(100vh - 36px);
      }
    }
  </style>
</head>
<body>

  <main class="app-viewport">
    
    <!-- Background Accents Inside Viewport -->
    <div class="viewport-accent-1"></div>
    <div class="viewport-accent-2"></div>

    <section class="section-card">
      <div class="avatar-container">
        <img src="PICTURE PORTFOLIO.png" alt="Profile Photo" class="avatar-image">
      </div>
      
      <div class="title-shape-container">
        <h1 class="hero-title">Portfolio</h1>
      </div>

      <!-- Left-aligned Section Label -->
      <p class="section-subtitle">Social Media</p>

      <!-- Left-aligned Social Media List -->
      <div class="social-list-container">
        <div class="social-item">
          <i class="fa-brands fa-facebook-f"></i>
          <span>Facebook</span>
          <span class="colon">:</span>
        </div>

        <div class="social-item">
          <i class="fa-brands fa-instagram"></i>
          <span>Instagram</span>
          <span class="colon">:</span>
        </div>

        <div class="social-item">
          <i class="fa-brands fa-tiktok"></i>
          <span>TikTok</span>
          <span class="colon">:</span>
        </div>
      </div>

      <!-- Quote Container Under Social Media -->
      <div class="quote-box">
        <p class="quote-text">
          "The lens captures story, vision powers creation, and code brings logic to life—I craft experiences across cinema, photography, circuitry, and digital space, driven by a relentless passion to direct, design, and build the extraordinary."
        </p>
      </div>
      
    </section>

  </main>

</body>
</html>
